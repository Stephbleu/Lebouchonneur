name: Mise à jour des cours et dividendes

on:
  schedule:
    - cron: "30 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer cours et dividendes
        run: python scripts/update_quotes.py

      - name: Enregistrer si le fichier a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.csv
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour des cours et dividendes"
            git push
          fi
